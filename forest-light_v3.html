<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>빛이 머무는 숲 · v3</title>
<style>
  * { box-sizing: border-box; }
  :root { color-scheme: dark; }
  body { margin: 0; color: #e2efe9; background: #030c12; font-family: "Malgun Gothic", system-ui, sans-serif; }
  main { position: relative; height: calc(100svh - 150px); min-height: 360px; overflow: hidden; isolation: isolate; touch-action: none; }
  main canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #forest { z-index: 0; }
  #camera { width: 112px; height: 84px; object-fit: cover; transform: scaleX(-1); border-radius: 12px; background: #14272b; }
  #camera[hidden] { display: none; }
  #shade { z-index: 2; }
  #light { z-index: 3; }
  header, footer { position: absolute; z-index: 4; left: 5%; right: 5%; display: flex; justify-content: space-between; gap: 24px; }
  header { top: 34px; align-items: flex-start; }
  .eyebrow { margin: 0 0 12px; font-size: 10px; letter-spacing: .3em; color: #9bbcaf; }
  h1 { margin: 0; font-size: clamp(23px, 3vw, 39px); font-weight: 400; letter-spacing: .12em; font-family: "Batang", serif; }
  .edition { padding-top: 4px; text-align: right; font-size: 10px; letter-spacing: .18em; line-height: 2; color: #96b1aa; }
  footer { bottom: 32px; align-items: flex-end; }
  .hint { font-size: 13px; line-height: 1.9; color: #d2e4dd; margin: 0; text-shadow: 0 2px 10px #000; }
  .hint span { display: block; font-size: 11px; color: #97b4a7; }
  .controls { max-width: 360px; text-align: right; }
  button { color: #e3f4ed; background: #0b2525b8; border: 1px solid #a7e0c740; padding: 13px 22px; border-radius: 30px; font: inherit; font-size: 12px; cursor: pointer; backdrop-filter: blur(12px); transition: background .2s, border-color .2s; }
  button:hover { background: #1a3e3bc9; border-color: #a7e0c791; }
  button:focus-visible { outline: 2px solid #c4ffe4; outline-offset: 5px; }
  button:disabled { opacity: .6; cursor: wait; }
  #status { margin: 10px 0 0; color: #b9cec5; font-size: 11px; line-height: 1.6; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .camera-bar { min-height: 150px; display: flex; align-items: center; gap: 22px; padding: 18px 5%; background: #0a1a20; border-top: 1px solid #9dd3bb26; flex-wrap: wrap; }
  .previews { display: flex; gap: 12px; align-items: center; }
  .preview-item { margin: 0; text-align: center; }
  .preview-item figcaption { color: #9fbeb3; font-size: 10px; margin-top: 6px; }
  #face-preview { display: block; width: 70px; height: 84px; background: #14272b; border: 1px solid #b4e9cd70; border-radius: 40%; }
  .tracking-info { flex: 1; min-width: 220px; }
  #tracking { margin: 0 0 12px; font-size: 13px; color: #dcefe5; }
  .zoom-control { display: flex; align-items: center; gap: 12px; color: #a6c7b8; font-size: 12px; }
  input[type=range] { accent-color: #b2ecd0; width: min(200px, 35vw); }
  output { min-width: 40px; font-variant-numeric: tabular-nums; }
  @media (max-width: 600px) {
    header { top: 24px; } .edition { display: none; }
    footer { bottom: 22px; flex-direction: column; align-items: flex-start; gap: 20px; }
    .controls { text-align: left; }
    main { height: calc(100svh - 240px); }
    .camera-bar { gap: 14px; padding-top: 14px; padding-bottom: 14px; }
    .camera-bar .controls { width: 100%; }
    #status { margin-top: 6px; }
    #camera { width: 82px; height: 68px; } #face-preview { width: 57px; height: 68px; }
    .tracking-info { min-width: 150px; }
    .hint { font-size: 12px; }
  }
</style>
</head>
<body>
<main id="stage" aria-label="마우스나 손가락을 움직이면 부드러운 빛과 흰 잔상이 나타나는 어두운 숲">
  <canvas id="forest" aria-hidden="true"></canvas>
  <canvas id="shade" aria-hidden="true"></canvas>
  <canvas id="light" aria-hidden="true"></canvas>
  <header>
    <div><p class="eyebrow">A LITTLE LIGHT IN THE FOREST</p><h1>빛이 머무는 숲</h1></div>
    <div class="edition">INTERACTIVE SCENE<br>01 — MOONLIT FOREST</div>
  </header>
  <footer>
    <p class="hint"><span id="summon-message" style="font-size:13px;color:#d2e4dd" role="status">숲이 다시 잠들었어요.</span><span id="summon-guide">원을 그려 요정을 불러주세요.</span></p>
  </footer>
</main>
<section class="camera-bar" aria-label="웹캠과 얼굴 확대 조절">
  <div class="previews">
    <figure class="preview-item"><video id="camera" autoplay muted playsinline hidden aria-label="거울처럼 보이는 웹캠 원본"></video><figcaption>웹캠 원본</figcaption></figure>
    <figure class="preview-item"><canvas id="face-preview" width="210" height="252" aria-label="요정 얼굴에 들어가는 자동 확대 영상"></canvas><figcaption>요정의 얼굴</figcaption></figure>
  </div>
  <div class="tracking-info"><p id="tracking" role="status">웹캠을 켜면 얼굴을 찾아 자동으로 맞춰요.</p><label class="zoom-control">얼굴 확대 <input id="face-zoom" type="range" min="0.75" max="2" step="0.05" value="1" aria-label="자동으로 맞춘 얼굴의 추가 확대"><output id="zoom-value">1.00배</output></label></div>
  <div class="controls"><button id="toggle" type="button" aria-pressed="false">웹캠 켜기 ↗</button><p id="status" role="status">얼굴 찾기 도구를 불러올 때 인터넷이 필요해요.<br>영상은 PC 안에서만 처리하며 녹화하지 않아요.</p></div>
</section>
<script>
(() => {
  'use strict';
  const stage = document.getElementById('stage');
  const forest = document.getElementById('forest'), fg = forest.getContext('2d');
  const shade = document.getElementById('shade'), sg = shade.getContext('2d');
  const light = document.getElementById('light'), lg = light.getContext('2d');
  const video = document.getElementById('camera');
  const button = document.getElementById('toggle'), status = document.getElementById('status');
  const preview = document.getElementById('face-preview'), pg = preview.getContext('2d');
  const tracking = document.getElementById('tracking'), zoom = document.getElementById('face-zoom');
  let detector = null, detectorLoading = null, detectorFailed = false, face = null;
  let lastSeen = -Infinity, lastDetect = -Infinity, lastVideoTime = -1;
  zoom.addEventListener('input', () => { document.getElementById('zoom-value').value = Number(zoom.value).toFixed(2) + '배'; });
  function trackingMessage(message) { if (tracking.textContent !== message) tracking.textContent = message; }
  async function prepareDetector() {
    if (detector) return detector;
    if (detectorLoading) return detectorLoading;
    trackingMessage('얼굴 찾기를 준비하고 있어요…');
    detectorFailed = false;
    detectorLoading = (async () => {
      const { FaceDetector, FilesetResolver } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs');
      const files = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm');
      detector = await FaceDetector.createFromOptions(files, { baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite' }, runningMode: 'VIDEO', minDetectionConfidence: .45 });
      return detector;
    })().catch(() => {
      detectorFailed = true; detectorLoading = null;
      if (stream) trackingMessage('얼굴 찾기를 불러오지 못했어요. 인터넷을 확인하고 웹캠을 다시 켜 주세요.');
      return null;
    });
    return detectorLoading;
  }
  function faceCrop(vw, vh, box, magnification) {
    const ratio = preview.width / preview.height;
    const cropHeight = Math.min(vh, vw / ratio, Math.max(box.height * 1.32, box.width * 1.18 / ratio) / magnification);
    const cropWidth = cropHeight * ratio;
    return { x: Math.max(0, Math.min(vw - cropWidth, box.cx - cropWidth / 2)), y: Math.max(0, Math.min(vh - cropHeight, box.cy - box.height * .08 - cropHeight / 2)), width: cropWidth, height: cropHeight };
  }
  function updateFace(time) {
    pg.clearRect(0, 0, preview.width, preview.height);
    if (!stream || video.readyState < 2) return;
    if (detector && !detectorFailed && time - lastDetect >= 100 && video.currentTime !== lastVideoTime) {
      lastDetect = time; lastVideoTime = video.currentTime;
      try {
        const faces = detector.detectForVideo(video, time).detections;
        const best = faces.reduce((a, b) => !a || b.boundingBox.width * b.boundingBox.height > a.boundingBox.width * a.boundingBox.height ? b : a, null);
        if (best) {
          const b = best.boundingBox, next = { cx: b.originX + b.width / 2, cy: b.originY + b.height / 2, width: b.width, height: b.height };
          if (!face || time - lastSeen > 600) face = next;
          else for (const key of ['cx', 'cy', 'width', 'height']) face[key] += (next[key] - face[key]) * .38;
          lastSeen = time; trackingMessage('얼굴을 찾았어요 · 거리에 맞춰 자동으로 확대 중');
        } else if (time - lastSeen > 600) { face = null; trackingMessage('얼굴을 찾고 있어요. 밝은 곳에서 카메라를 바라봐 주세요.'); }
      } catch {
        detectorFailed = true; detector?.close(); detector = null; detectorLoading = null; face = null;
        trackingMessage('얼굴 찾기가 멈췄어요. 웹캠을 껐다가 다시 켜 주세요.');
      }
    }
    if (time - lastSeen > 600) face = null;
    if (!face) return;
    const crop = faceCrop(video.videoWidth, video.videoHeight, face, Number(zoom.value));
    pg.save(); pg.translate(preview.width, 0); pg.scale(-1, 1);
    pg.drawImage(video, crop.x, crop.y, crop.width, crop.height, 0, 0, preview.width, preview.height); pg.restore();
  }
  function drawFairy(time) {
    if (fairyOpacity < .005) return;
    const emergence = fairyOpacity * fairyOpacity * (3 - 2 * fairyOpacity);
    const bob = reducedMotion ? 0 : Math.sin(time * .0017) * 2 * emergence;
    lg.save(); lg.translate(x, y + 22 * (1 - emergence) + bob);
    lg.scale(.65 + emergence * .35, .65 + emergence * .35); lg.globalAlpha = emergence;
    const flutter = reducedMotion ? 0 : Math.sin(time * .009) * .1;
    for (const side of [-1, 1]) {
      oval(lg, side * 31, -4, 19, 38, '#bcece264', side * (.58 + flutter));
      oval(lg, side * 29, 28, 14, 23, '#c9d5ff4a', side * -.65);
    }
    lg.strokeStyle = '#c4ddcf'; lg.lineWidth = 5; lg.lineCap = 'round';
    for (const side of [-1, 1]) {
      lg.beginPath(); lg.moveTo(side * 9, 40); lg.lineTo(side * 12, 65); lg.stroke();
      lg.beginPath(); lg.moveTo(side * 14, 0); lg.lineTo(side * 27, 22); lg.stroke();
    }
    const dress = lg.createLinearGradient(0, -8, 0, 48); dress.addColorStop(0, '#c5efda'); dress.addColorStop(1, '#4e9d88');
    lg.fillStyle = dress; lg.beginPath(); lg.moveTo(-12, -8); lg.quadraticCurveTo(-13, 16, -26, 44); lg.quadraticCurveTo(0, 57, 26, 44); lg.quadraticCurveTo(13, 16, 12, -8); lg.fill();
    oval(lg, 0, -33, 25, 31, '#d4e8dc');
    lg.save(); lg.beginPath(); lg.ellipse(0, -32, 21, 26, 0, 0, Math.PI * 2); lg.clip();
    if (face && stream && video.readyState >= 2) lg.drawImage(preview, -21, -58, 42, 52);
    else {
      lg.fillStyle = '#ead9c9'; lg.fillRect(-21, -58, 42, 52);
      oval(lg, -7, -32, 2, 3, '#31554d'); oval(lg, 7, -32, 2, 3, '#31554d');
      lg.strokeStyle = '#966b6d'; lg.lineWidth = 1.5; lg.beginPath(); lg.arc(0, -24, 5, .1, Math.PI - .1); lg.stroke();
    }
    lg.restore();
    for (let i = 0; i < 7; i++) { const a = Math.PI + i / 6 * Math.PI; oval(lg, Math.cos(a) * 23, -30 + Math.sin(a) * 28, 5, 4, i % 2 ? '#e7e4ff' : '#c0efda', a); }
    oval(lg, 0, -61, 3, 3, '#fff5d8'); lg.restore();
  }
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let width = 1, height = 1, stream = null, cameraRequest = 0;
  let x = 0, y = 0, targetX = 0, targetY = 0, active = false, strength = 0, previousTime = 0;
  let lastPoint = null;
  let fairyOpacity = 0, lastCircleMotion = -Infinity, circleRadius = 150, targetRadius = 150;
  let pointerX = 0, pointerY = 0, lastPointerMotion = -Infinity, pointerGlow = 0;
  const gesturePoints = [];
  const particles = [];

  // 창 크기가 같으면 같은 모양의 숲을 그린다.
  function randomSource(seed) {
    return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  }
  function oval(g, px, py, rx, ry, color, rotation = 0) {
    g.fillStyle = color; g.beginPath(); g.ellipse(px, py, rx, ry, rotation, 0, Math.PI * 2); g.fill();
  }
  function haze(g, px, py, radius, color) {
    const glow = g.createRadialGradient(px, py, 0, px, py, radius);
    glow.addColorStop(0, color); glow.addColorStop(1, 'transparent');
    g.fillStyle = glow; g.fillRect(px - radius, py - radius, radius * 2, radius * 2);
  }
  function drawPortal(time) {
    if (strength < .005) return;
    const opening = strength * strength * (3 - 2 * strength);
    const r = circleRadius * (.78 + .22 * opening);
    const spin = reducedMotion ? 0 : time * .00025;
    lg.save(); lg.translate(x, y); lg.globalAlpha = opening;
    lg.globalCompositeOperation = 'screen';
    // 원 안쪽의 빛도 고리와 같은 속도로 나타나고 사라진다.
    const interior = lg.createRadialGradient(0, 0, 0, 0, 0, r);
    interior.addColorStop(0, 'rgba(255,224,171,.30)');
    interior.addColorStop(.65, 'rgba(255,177,83,.18)');
    interior.addColorStop(.88, 'rgba(255,148,53,.08)');
    interior.addColorStop(1, 'transparent');
    lg.fillStyle = interior; lg.fillRect(-r, -r, r * 2, r * 2);
    haze(lg, 0, 0, r * 1.28, '#ff94291c');
    lg.strokeStyle = '#ff871d'; lg.shadowColor = '#ff6b16'; lg.shadowBlur = 15;
    lg.lineWidth = 3; lg.beginPath(); lg.arc(0, 0, r, 0, Math.PI * 2); lg.stroke();
    lg.strokeStyle = '#ffe6ac'; lg.lineWidth = 1.2; lg.shadowBlur = 7;
    lg.beginPath(); lg.arc(0, 0, r - 5, 0, Math.PI * 2); lg.stroke();
    for (let i = 0; i < 28; i++) {
      const a = i / 28 * Math.PI * 2 + spin;
      lg.strokeStyle = '#ffc477a0'; lg.lineWidth = 1;
      lg.beginPath(); lg.arc(0, 0, r - 12, a, a + .10); lg.stroke();
    }
    lg.shadowBlur = 0;
    for (let i = 0; i < 100; i++) {
      const phase = reducedMotion ? .3 : (time * .00065 + i * .618034) % 1;
      const a = i * 2.399963 + spin + phase * .1;
      const distance = r + phase * (12 + i % 9 * 3);
      const px = Math.cos(a) * distance, py = Math.sin(a) * distance + phase * phase * 16;
      lg.globalAlpha = opening * (1 - phase) * .85;
      lg.strokeStyle = i % 3 ? '#ffb14f' : '#fff1c6'; lg.lineWidth = i % 4 ? 1 : 1.8;
      lg.beginPath(); lg.moveTo(px, py); lg.lineTo(px + Math.cos(a + .45) * (2 + phase * 8), py + Math.sin(a + .45) * (2 + phase * 8)); lg.stroke();
    }
    lg.restore();
  }
  function resize() {
    const rect = stage.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
    width = rect.width; height = rect.height;
    for (const canvas of [forest, shade, light]) { canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr); canvas.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0); }
    x = targetX = width * .55; y = targetY = height * .55; lastPoint = null; particles.length = 0;
    fg.fillStyle = '#030c12'; fg.fillRect(0, 0, width, height);
    gesturePoints.length = 0; lastCircleMotion = -Infinity; fairyOpacity = 0; strength = 0;
    lastPointerMotion = -Infinity; pointerGlow = 0;
  }
  new ResizeObserver(resize).observe(stage);
  function move(event) {
    if (event.target.closest('button')) return;
    const rect = stage.getBoundingClientRect(), px = event.clientX - rect.left, py = event.clientY - rect.top;
    active = true;
    const now = performance.now();
    if (Math.hypot(px - pointerX, py - pointerY) >= 1) lastPointerMotion = now;
    pointerX = px; pointerY = py;
    if (gesturePoints.length && now - gesturePoints[gesturePoints.length - 1].time > 250) {
      gesturePoints.length = 0; lastPoint = null;
    }
    const previous = gesturePoints[gesturePoints.length - 1];
    if (!previous || Math.hypot(px - previous.x, py - previous.y) >= 4) {
      gesturePoints.push({ x: px, y: py, time: now });
      while (gesturePoints.length && now - gesturePoints[0].time > 1400) gesturePoints.shift();
      let turn = 0, travel = 0;
      for (let i = 1; i < gesturePoints.length; i++) {
        const a = gesturePoints[i - 1], b = gesturePoints[i];
        travel += Math.hypot(b.x - a.x, b.y - a.y);
        if (i >= 2) {
          const p = gesturePoints[i - 2];
          let angle = Math.atan2(b.y - a.y, b.x - a.x) - Math.atan2(a.y - p.y, a.x - p.x);
          angle = Math.atan2(Math.sin(angle), Math.cos(angle));
          turn += angle;
        }
      }
      // 같은 방향으로 둥글게 움직일 때만 요정을 보여 준다.
      if (travel > 65 && Math.abs(turn) > Math.PI * .65 && gesturePoints.length >= 5) {
        const a = gesturePoints[0], b = gesturePoints[Math.floor(gesturePoints.length / 2)], c = gesturePoints[gesturePoints.length - 1];
        const bx = b.x - a.x, by = b.y - a.y, cx = c.x - a.x, cy = c.y - a.y;
        const determinant = 2 * (bx * cy - by * cx);
        if (Math.abs(determinant) > 100) {
          const bb = bx * bx + by * by, cc = cx * cx + cy * cy;
          const centerX = a.x + (cy * bb - by * cc) / determinant;
          const centerY = a.y + (bx * cc - cx * bb) / determinant;
          const radius = Math.hypot(a.x - centerX, a.y - centerY);
          const error = gesturePoints.reduce((sum, p) => sum + Math.abs(Math.hypot(p.x - centerX, p.y - centerY) - radius), 0) / gesturePoints.length;
          if (radius >= 20 && radius <= Math.min(width, height) * .65 && error < radius * .25 && centerX >= 0 && centerX <= width && centerY >= 0 && centerY <= height) {
            if (strength < .01) {
              x = targetX = centerX; y = targetY = centerY;
              circleRadius = targetRadius = Math.max(85, radius);
            } else if (Math.hypot(centerX - targetX, centerY - targetY) < circleRadius * .5) {
              targetX += (centerX - targetX) * .08; targetY += (centerY - targetY) * .08;
              targetRadius += (Math.max(85, radius) - targetRadius) * .06;
            }
            lastCircleMotion = now;
          }
        }
      }
    }
    if (lastPoint) {
      const dx = px - lastPoint.x, dy = py - lastPoint.y, distance = Math.hypot(dx, dy);
      const count = Math.min(18, Math.floor(distance / 9));
      for (let i = 1; i <= count; i++) {
        const t = i / count;
        particles.push({ x: lastPoint.x + dx * t + (Math.random() - .5) * 9, y: lastPoint.y + dy * t + (Math.random() - .5) * 9, born: now, life: 1400 + Math.random() * 1400, radius: .7 + Math.random() * 1.3, drift: (Math.random() - .5) * 14 });
      }
      if (count) lastPoint = { x: px, y: py };
    } else lastPoint = { x: px, y: py };
    if (particles.length > 320) particles.splice(0, particles.length - 320);
  }
  stage.addEventListener('pointermove', move);
  stage.addEventListener('pointerdown', move);
  stage.addEventListener('pointerleave', () => { active = false; lastPoint = null; gesturePoints.length = 0; });
  stage.addEventListener('pointercancel', () => { active = false; lastPoint = null; gesturePoints.length = 0; });
  function frame(time) {
    updateFace(time);
    const dt = Math.min((time - previousTime) / 1000 || .016, .05); previousTime = time;
    const follow = 1 - Math.exp(-dt * 3);
    const drawingCircle = active && time - lastCircleMotion < 400 && time - lastPointerMotion < 180;
    strength += ((drawingCircle ? 1 : 0) - strength) * (1 - Math.exp(-dt * (drawingCircle ? 2.2 : 1.8)));
    const fairyTarget = Math.pow(strength, 1.35);
    fairyOpacity += (fairyTarget - fairyOpacity) * (1 - Math.exp(-dt * 3));
    pointerGlow += ((active && time - lastPointerMotion < 100 ? 1 : 0) - pointerGlow) * (1 - Math.exp(-dt * 9));
    x += (targetX - x) * follow; y += (targetY - y) * follow;
    circleRadius += (targetRadius - circleRadius) * follow;
    sg.clearRect(0, 0, width, height); sg.globalCompositeOperation = 'source-over';
    sg.fillStyle = '#00070e94'; sg.fillRect(0, 0, width, height);
    const radius = circleRadius;
    const opening = sg.createRadialGradient(x, y, 0, x, y, radius);
    opening.addColorStop(0, `rgba(0,0,0,${strength * .94})`); opening.addColorStop(.3, `rgba(0,0,0,${strength * .8})`); opening.addColorStop(1, 'transparent');
    sg.globalCompositeOperation = 'destination-out'; sg.fillStyle = opening; sg.fillRect(0, 0, width, height); sg.globalCompositeOperation = 'source-over';
    lg.clearRect(0, 0, width, height); lg.globalCompositeOperation = 'screen';
    haze(lg, x, y, radius * .8, `rgba(160,220,207,${strength * .13})`);
    haze(lg, x, y, 34, `rgba(233,252,243,${strength * .21})`);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i], age = (time - p.born) / p.life;
      if (age >= 1) { particles.splice(i, 1); continue; }
      const alpha = Math.pow(1 - age, 1.7), py = p.y - (reducedMotion ? 0 : age * 18), px = p.x + (reducedMotion ? 0 : p.drift * age);
      haze(lg, px, py, p.radius * 8, `rgba(255,153,54,${alpha * .42})`);
      oval(lg, px, py, p.radius * (1 - age * .35), p.radius * (1 - age * .35), `rgba(255,255,255,${alpha})`);
    }
    haze(lg, pointerX, pointerY, 22, `rgba(255,173,76,${pointerGlow * .38})`);
    oval(lg, pointerX, pointerY, 1.8, 1.8, `rgba(255,245,220,${pointerGlow})`);
    oval(lg, x, y, 2.2, 2.2, `rgba(255,255,255,${strength * .9})`);
    lg.globalCompositeOperation = 'source-over';
    drawPortal(time);
    drawFairy(time);
    const awake = strength > .08;
    const message = awake ? '숲이 깨어나고 있어요.' : '숲이 다시 잠들었어요.';
    const guide = awake ? '원을 천천히 이어 그리면 요정이 함께 머물러요.' : '원을 그려 요정을 불러주세요.';
    const messageElement = document.getElementById('summon-message');
    const guideElement = document.getElementById('summon-guide');
    if (messageElement.textContent !== message) messageElement.textContent = message;
    if (guideElement.textContent !== guide) guideElement.textContent = guide;
    requestAnimationFrame(frame);
  }
  function stopCamera() {
    cameraRequest++;
    if (stream) stream.getTracks().forEach(track => track.stop());
    stream = null; video.srcObject = null; video.hidden = true;
    face = null; lastSeen = -Infinity; pg.clearRect(0, 0, preview.width, preview.height);
    trackingMessage('웹캠을 켜면 얼굴을 찾아 자동으로 맞춰요.');
    button.textContent = '웹캠 켜기 ↗'; button.setAttribute('aria-pressed', 'false'); button.disabled = false;
  }
  button.addEventListener('click', async () => {
    if (stream) { stopCamera(); status.textContent = '웹캠을 껐어요. 숲의 빛은 계속 움직여요.'; return; }
    const request = ++cameraRequest;
    button.disabled = true; status.textContent = 'Chrome에서 카메라 사용을 허용해 주세요.';
    let incoming = null;
    try {
      if (!navigator.mediaDevices?.getUserMedia) throw new Error('secure-context');
      incoming = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
      if (request !== cameraRequest) { incoming.getTracks().forEach(track => track.stop()); return; }
      stream = incoming; video.srcObject = stream; await video.play();
      if (request !== cameraRequest) return;
      face = null; lastSeen = -Infinity; lastVideoTime = -1;
      video.hidden = false; button.textContent = '웹캠 끄기'; button.setAttribute('aria-pressed', 'true');
      status.textContent = '아래에서 얼굴을 확인하고, 숲 위로 마우스를 움직여 보세요.';
      void prepareDetector();
      stream.getVideoTracks()[0].addEventListener('ended', () => { if (stream === incoming) { stopCamera(); status.textContent = '카메라 연결이 끝났어요. 다시 켤 수 있어요.'; } });
    } catch (error) {
      if (incoming) incoming.getTracks().forEach(track => track.stop());
      if (request !== cameraRequest) return;
      stopCamera();
      const messages = { NotAllowedError: '카메라가 허용되지 않았어요. Chrome의 카메라 권한을 확인해 주세요.', NotFoundError: '연결된 카메라를 찾지 못했어요. 웹캠 연결을 확인해 주세요.', NotReadableError: '카메라를 사용하지 못했어요. 다른 앱에서 카메라를 사용 중인지 확인해 주세요.' };
      status.textContent = messages[error.name] || '웹캠을 켜지 못했어요. 실행 방법을 함께 확인해 주세요.';
    } finally { if (request === cameraRequest) button.disabled = false; }
  });
  window.addEventListener('pagehide', stopCamera);
  resize(); requestAnimationFrame(frame);
})();
</script>
